name: CI
on:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Preliminary Checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Static Checks
        run: uv run poe static-checks

  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version: # keep in sync with requires-python in pyproject.toml
          - '3.11'
          - '3.12'
          - '3.13'
    runs-on: ${{ matrix.os }}
    name: Test on Python ${{ matrix.python-version }}, on ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Test
        shell: bash
        run: uv run poe test

  generate:
    needs: check
    runs-on: ubuntu-24.04
    name: Generate applicant templates
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-calc

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Test with Coverage (including ODS checks)
        run: |
          uv run poe coverage
          uv run poe coverage-report

      - name: Generate XLSX and ODS for every programme
        run: uv run poe generate

      - name: Upload applicant templates
        uses: actions/upload-artifact@v7
        with:
          name: applicant-templates
          path: |
            dist/*.xlsx
            dist/*.ods
          if-no-files-found: error
