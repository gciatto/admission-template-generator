name: CI
on:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Preliminary Checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Static Checks
        run: uv run poe static-checks

  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version: # keep in sync with requires-python in pyproject.toml
          - '3.11'
          - '3.12'
          - '3.13'
    runs-on: ${{ matrix.os }}
    name: Test on Python ${{ matrix.python-version }}, on ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Test
        shell: bash
        run: uv run poe test

  generate:
    needs: check
    runs-on: ubuntu-26.04
    name: Generate applicant templates
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-calc

      - name: Restore Development Environment
        run: uv sync --locked

      - name: Test with Coverage (including ODS checks)
        run: |
          uv run poe coverage
          uv run poe coverage-report

      - name: Generate XLSX and ODS for every programme
        run: uv run poe generate

      - name: Upload applicant templates
        uses: actions/upload-artifact@v7
        with:
          name: applicant-templates
          path: |
            dist/*.xlsx
            dist/*.ods
          if-no-files-found: error

  release:
    needs:
      - test
      - generate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Release
    concurrency:
      group: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads all commits since the last tag

      - name: Download applicant templates
        uses: actions/download-artifact@v8
        with:
          name: applicant-templates
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Configure Git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Tags the version only: the pyproject.toml bump is not committed back to main.
      - name: Tag and create release
        id: release
        run: >-
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
          --no-commit --no-changelog --skip-build
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach workbooks to the release
        if: steps.release.outputs.released == 'true'
        run: >-
          uvx --from python-semantic-release==10.7.0 semantic-release -v publish
          --tag ${{ steps.release.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
